apiVersion: v1
kind: ConfigMap
metadata:
  name: oracle-init
data:
  01-create-schemas.sh: |
    #!/bin/bash
    sqlplus -s / as sysdba <<SQL
    ALTER SESSION SET CONTAINER = FREEPDB1;
    CREATE USER dinedash_order IDENTIFIED BY "${ORDER_DB_PASSWORD}" QUOTA UNLIMITED ON USERS;
    GRANT CREATE SESSION, CREATE TABLE, CREATE SEQUENCE, CREATE VIEW TO dinedash_order;
    CREATE USER dinedash_payment IDENTIFIED BY "${PAYMENT_DB_PASSWORD}" QUOTA UNLIMITED ON USERS;
    GRANT CREATE SESSION, CREATE TABLE, CREATE SEQUENCE, CREATE VIEW TO dinedash_payment;
    EXIT;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - name: oracle
              containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: ORACLE_PASSWORD
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: ORDER_DB_PASSWORD
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: PAYMENT_DB_PASSWORD
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /opt/oracle/oradata
            - name: init
              mountPath: /container-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: oracle-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: oracle
spec:
  selector:
    app: oracle
  ports:
    - name: oracle
      port: 1521
