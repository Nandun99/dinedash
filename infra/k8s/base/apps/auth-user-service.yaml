apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-user-service
  labels:
    app: auth-user-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: auth-user-service
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: auth-user-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: auth-user-service
          image: dinedash/auth-user-service
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: dinedash-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: JWT_SECRET
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: MSSQL_SA_PASSWORD
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dinedash-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-user-service
  labels:
    app: auth-user-service
spec:
  selector:
    app: auth-user-service
  ports:
    - name: http
      port: 8081
      targetPort: http
