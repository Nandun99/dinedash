name: dinedash

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: dinedash-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dinedash-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: dinedash
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: dinedash-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-dinedash}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dinedash}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: dinedash-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: dinedash-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-dinedash}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-dinedash}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-dinedash}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dinedash-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dinedash-123!}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dinedash-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dinedash-123!}
    volumes:
      - ./infra/mssql:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -i /scripts/init.sql"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application services. Start only the infrastructure above with:
  #   docker compose up -d kafka mongodb redis oracle mssql mssql-init
  # ---------------------------------------------------------------------------
  auth-user-service:
    build: &service-build
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: auth-user-service
    image: dinedash/auth-user-service:local
    environment:
      SERVER_PORT: 8081
      MSSQL_HOST: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dinedash-123!}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mssql-init:
        condition: service_completed_successfully

  restaurant-service:
    build:
      <<: *service-build
      args:
        SERVICE: restaurant-service
    image: dinedash/restaurant-service:local
    environment:
      SERVER_PORT: 8082
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-dinedash}:${MONGO_ROOT_PASSWORD:-dinedash}@mongodb:27017/dinedash_restaurant?authSource=admin
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-dinedash-media}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      <<: *service-build
      args:
        SERVICE: order-service
    image: dinedash/order-service:local
    environment:
      SERVER_PORT: 8083
      ORACLE_HOST: oracle
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-dinedash}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      <<: *service-build
      args:
        SERVICE: payment-service
    image: dinedash/payment-service:local
    environment:
      SERVER_PORT: 8084
      ORACLE_HOST: oracle
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-dinedash}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy

  delivery-service:
    build:
      <<: *service-build
      args:
        SERVICE: delivery-service
    image: dinedash/delivery-service:local
    environment:
      SERVER_PORT: 8085
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-dinedash}:${MONGO_ROOT_PASSWORD:-dinedash}@mongodb:27017/dinedash_delivery?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      <<: *service-build
      args:
        SERVICE: notification-service
    image: dinedash/notification-service:local
    environment:
      SERVER_PORT: 8086
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-dinedash}:${MONGO_ROOT_PASSWORD:-dinedash}@mongodb:27017/dinedash_notification?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    build:
      <<: *service-build
      args:
        SERVICE: api-gateway
    image: dinedash/api-gateway:local
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      AUTH_SERVICE_URL: http://auth-user-service:8081
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      DELIVERY_SERVICE_URL: http://delivery-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      - auth-user-service
      - restaurant-service
      - order-service
      - payment-service
      - delivery-service
      - notification-service

  frontend:
    build:
      context: frontend
    image: dinedash/frontend:local
    ports:
      - "3000:80"
    environment:
      API_UPSTREAM: http://api-gateway:8080
    depends_on:
      - api-gateway

volumes:
  mongo-data:
  oracle-data:
  mssql-data:
