server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: restaurant-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://dinedash:dinedash@localhost:27017/dinedash_restaurant?authSource=admin}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: restaurant-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.dinedash.common.event

dinedash:
  storage:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${S3_BUCKET:dinedash-media}
    public-base-url: ${MEDIA_BASE_URL:}
    upload-url-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
