server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-user-service
  datasource:
    url: jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DB:dinedash_auth};encrypt=true;trustServerCertificate=true
    username: ${MSSQL_USER:sa}
    password: ${MSSQL_SA_PASSWORD:Dinedash-123!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

dinedash:
  jwt:
    secret: ${JWT_SECRET}
    issuer: dinedash-auth
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
